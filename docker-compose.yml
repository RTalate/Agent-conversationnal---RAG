# PostgreSQL for development and for the integration tests (make db-up).
# The credentials match server/.env.sample. The port is only published on this machine.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sqlgen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sqlgen-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlgen"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sqlgen-data:

# Temporary: runs every check once on Windows, then this file is removed (this project has no CI).
name: Windows check
on:
  push:
    branches: [claude/local-embedded-postgres]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm run verify
        run: npm run verify
